        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
        '502': { $ref: '#/components/responses/Problem502' }
        '503': { $ref: '#/components/responses/Problem503' }
    post:
      tags: [catalog]
      operationId: createProductV2
      x-safety: { csrf: required, idempotency: required, ifMatch: exempt }
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { $ref: '#/components/parameters/IdempotencyHeader' }
        - { $ref: '#/components/parameters/RequestIdHeader' }
      requestBody: { $ref: '#/components/requestBodies/ProductCreateRequestV2' }
      responses:
        '201': { $ref: '#/components/responses/ProductCreated' }
        '202': { $ref: '#/components/responses/CommandStatusInProgress' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '409': { $ref: '#/components/responses/Problem409' }
        '428': { $ref: '#/components/responses/Problem428' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
        '502': { $ref: '#/components/responses/Problem502' }
        '503': { $ref: '#/components/responses/Problem503' }
