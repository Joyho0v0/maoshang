      tags: [commands]
      operationId: getCommandStatusV2
      parameters:
        - { $ref: '#/components/parameters/IdempotencyHeader' }
        - { $ref: '#/components/parameters/CommandOperationHeader' }
        - { $ref: '#/components/parameters/RequestIdHeader' }
      responses:
