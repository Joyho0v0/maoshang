openapi: 3.1.0
info:
  title: Autoflow Catalog and Orders API v2 (review-only)
  version: 2.0.0-review
  description: Complete parseable review-only v2 candidate. It is not promoted and must not be consumed by runtime code.
  x-contract-status: PENDING_REVIEW
  x-v1-artifact-unchanged: true
servers:
  - url: /api/v2
    description: Isolated v2 base path.
security:
  - CookieSession: []
tags:
  - { name: auth }
  - { name: commands }
  - { name: catalog }
  - { name: orders }
  - { name: files }
paths:
  /auth/csrf:
    get:
      tags: [auth]
      security: []
      operationId: getCsrfTokenV2
      responses:
        '200': { $ref: '#/components/responses/CsrfToken' }
        '400': { $ref: '#/components/responses/Problem400' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
        '502': { $ref: '#/components/responses/Problem502' }
        '503': { $ref: '#/components/responses/Problem503' }
  /auth/sessions/current:
    get:
      tags: [auth]
      operationId: getCurrentSessionV2
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Problem401' }
        '500': { $ref: '#/components/responses/Problem500' }
        '502': { $ref: '#/components/responses/Problem502' }
        '503': { $ref: '#/components/responses/Problem503' }
  /commands/status:
    get:
      tags: [commands]
      operationId: getCommandStatusV2
      parameters:
        - { $ref: '#/components/parameters/IdempotencyHeader' }
        - { $ref: '#/components/parameters/CommandOperationHeader' }
        - { $ref: '#/components/parameters/RequestIdHeader' }
      responses:
        '200': { $ref: '#/components/responses/CommandStatus' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
        '502': { $ref: '#/components/responses/Problem502' }
        '503': { $ref: '#/components/responses/Problem503' }
  /products:
    get:
      tags: [catalog]
      operationId: listProductsV2
      description: Product list uses a single status filter and a resource-specific sort union. Other single-column sorts append the same-direction id tie-breaker; string comparisons use COLLATE "C".
      x-cursor-binding: { fields: [version, operation, resource, organization, scopeFingerprint, authzVersion, sort, filters, pageSize, lastTuple], resource: PRODUCT, defaultSort: '-updatedAt,-id', filterAllowlist: [ACTIVE, INACTIVE], collation: C, tieBreaker: id }
      parameters:
        - { $ref: '#/components/parameters/PageAfter' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/ProductStatusFilter' }
        - { $ref: '#/components/parameters/ProductSort' }
        - { $ref: '#/components/parameters/RequestIdHeader' }
      responses:
        '200': { $ref: '#/components/responses/ProductPage' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
        '502': { $ref: '#/components/responses/Problem502' }
        '503': { $ref: '#/components/responses/Problem503' }
    post:
      tags: [catalog]
      operationId: createProductV2
      x-safety: { csrf: required, idempotency: required, ifMatch: exempt }
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { $ref: '#/components/parameters/IdempotencyHeader' }
        - { $ref: '#/components/parameters/RequestIdHeader' }
      requestBody: { $ref: '#/components/requestBodies/ProductCreateRequestV2' }
      responses:
        '201': { $ref: '#/components/responses/ProductCreated' }
        '202': { $ref: '#/components/responses/CommandStatusInProgress' }
        '400': { $ref: '#/components/responses/Problem400Mutation' }
        '401': { $ref: '#/components/responses/Problem401Mutation' }
        '403': { $ref: '#/components/responses/Problem403Mutation' }
        '409': { $ref: '#/components/responses/Problem409Mutation' }
        '428': { $ref: '#/components/responses/Problem428Mutation' }
        '429': { $ref: '#/components/responses/Problem429Mutation' }
        '500': { $ref: '#/components/responses/Problem500Mutation' }
        '502': { $ref: '#/components/responses/Problem502' }
        '503': { $ref: '#/components/responses/Problem503' }
  /products/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      tags: [catalog]
      operationId: getProductV2
      parameters: [{ $ref: '#/components/parameters/RequestIdHeader' }]
      responses:
        '200': { $ref: '#/components/responses/Product' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
        '502': { $ref: '#/components/responses/Problem502' }
        '503': { $ref: '#/components/responses/Problem503' }
    patch:
      tags: [catalog]
      operationId: updateProductV2
      x-safety: { csrf: required, idempotency: required, ifMatch: required }
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { $ref: '#/components/parameters/IdempotencyHeader' }
        - { $ref: '#/components/parameters/IfMatchHeader' }
        - { $ref: '#/components/parameters/RequestIdHeader' }
      requestBody: { $ref: '#/components/requestBodies/ProductUpdateRequestV2' }
      responses:
        '200': { $ref: '#/components/responses/ProductUpdated' }
        '202': { $ref: '#/components/responses/CommandStatusInProgress' }
        '400': { $ref: '#/components/responses/Problem400Mutation' }
        '401': { $ref: '#/components/responses/Problem401Mutation' }
        '403': { $ref: '#/components/responses/Problem403Mutation' }
        '404': { $ref: '#/components/responses/Problem404Mutation' }
        '409': { $ref: '#/components/responses/Problem409Mutation' }
        '428': { $ref: '#/components/responses/Problem428Mutation' }
        '429': { $ref: '#/components/responses/Problem429Mutation' }
        '500': { $ref: '#/components/responses/Problem500Mutation' }
        '502': { $ref: '#/components/responses/Problem502' }
        '503': { $ref: '#/components/responses/Problem503' }
  /skus:
    get:
      tags: [catalog]
      operationId: listSkusV2
      description: SKU list uses a single status filter and a resource-specific sort union. Other single-column sorts append the same-direction id tie-breaker; string comparisons use COLLATE "C".
      x-cursor-binding: { fields: [version, operation, resource, organization, scopeFingerprint, authzVersion, sort, filters, pageSize, lastTuple], resource: SKU, defaultSort: '-updatedAt,-id', filterAllowlist: [ACTIVE, INACTIVE], collation: C, tieBreaker: id }
      parameters:
        - { $ref: '#/components/parameters/PageAfter' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/SkuStatusFilter' }
        - { $ref: '#/components/parameters/SkuSort' }
        - { $ref: '#/components/parameters/RequestIdHeader' }
      responses:
        '200': { $ref: '#/components/responses/SkuPage' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
        '502': { $ref: '#/components/responses/Problem502' }
        '503': { $ref: '#/components/responses/Problem503' }
    post:
      tags: [catalog]
      operationId: createSkuV2
      x-safety: { csrf: required, idempotency: required, ifMatch: exempt }
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { $ref: '#/components/parameters/IdempotencyHeader' }
        - { $ref: '#/components/parameters/RequestIdHeader' }
      requestBody: { $ref: '#/components/requestBodies/SkuCreateRequestV2' }
      responses:
        '201': { $ref: '#/components/responses/SkuCreated' }
        '202': { $ref: '#/components/responses/CommandStatusInProgress' }
        '400': { $ref: '#/components/responses/Problem400Mutation' }
        '401': { $ref: '#/components/responses/Problem401Mutation' }
        '403': { $ref: '#/components/responses/Problem403Mutation' }
        '409': { $ref: '#/components/responses/Problem409Mutation' }
        '428': { $ref: '#/components/responses/Problem428Mutation' }
        '429': { $ref: '#/components/responses/Problem429Mutation' }
        '500': { $ref: '#/components/responses/Problem500Mutation' }
        '502': { $ref: '#/components/responses/Problem502' }
        '503': { $ref: '#/components/responses/Problem503' }
  /skus/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      tags: [catalog]
      operationId: getSkuV2
      parameters: [{ $ref: '#/components/parameters/RequestIdHeader' }]
      responses:
        '200': { $ref: '#/components/responses/Sku' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
        '502': { $ref: '#/components/responses/Problem502' }
        '503': { $ref: '#/components/responses/Problem503' }
    patch:
      tags: [catalog]
      operationId: updateSkuV2
      x-price-policy-writer:
        owner: catalog
        permission: catalog.price-policy.write
        ifMatch: sku.version
        actions: [CREATE, REPLACE, END]
        selection: "same currency active window first; otherwise exactly one overlapping active primary"
        audit: "PRICE_POLICY_CREATED|PRICE_POLICY_REPLACED|PRICE_POLICY_ENDED"
      x-safety: { csrf: required, idempotency: required, ifMatch: required }
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { $ref: '#/components/parameters/IdempotencyHeader' }
        - { $ref: '#/components/parameters/IfMatchHeader' }
        - { $ref: '#/components/parameters/RequestIdHeader' }
      requestBody: { $ref: '#/components/requestBodies/SkuUpdateRequestV2' }
      responses:
        '200': { $ref: '#/components/responses/SkuUpdated' }
        '202': { $ref: '#/components/responses/CommandStatusInProgress' }
        '400': { $ref: '#/components/responses/Problem400Mutation' }
        '401': { $ref: '#/components/responses/Problem401Mutation' }
        '403': { $ref: '#/components/responses/Problem403Mutation' }
        '404': { $ref: '#/components/responses/Problem404Mutation' }
        '409': { $ref: '#/components/responses/Problem409Mutation' }
        '428': { $ref: '#/components/responses/Problem428Mutation' }
        '429': { $ref: '#/components/responses/Problem429Mutation' }
        '500': { $ref: '#/components/responses/Problem500Mutation' }
        '502': { $ref: '#/components/responses/Problem502' }
        '503': { $ref: '#/components/responses/Problem503' }
  /orders:
    get:
      tags: [orders]
      operationId: listOrdersV2
      description: Order list uses a single status filter and a resource-specific sort union. Other single-column sorts append the same-direction id tie-breaker; string comparisons use COLLATE "C".
      x-cursor-binding: { fields: [version, operation, resource, organization, scopeFingerprint, authzVersion, sort, filters, pageSize, lastTuple], resource: ORDER, defaultSort: '-updatedAt,-id', filterAllowlist: [DRAFT, CONFIRMED, FULFILLED, CANCELLED], collation: C, tieBreaker: id }
      parameters:
        - { $ref: '#/components/parameters/PageAfter' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/OrderStatusFilter' }
        - { $ref: '#/components/parameters/OrderSort' }
        - { $ref: '#/components/parameters/RequestIdHeader' }
      responses:
        '200': { $ref: '#/components/responses/OrderPage' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
        '502': { $ref: '#/components/responses/Problem502' }
        '503': { $ref: '#/components/responses/Problem503' }
    post:
      tags: [orders]
      operationId: createOrderV2
      x-safety: { csrf: required, idempotency: required, ifMatch: exempt }
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { $ref: '#/components/parameters/IdempotencyHeader' }
        - { $ref: '#/components/parameters/RequestIdHeader' }
      requestBody: { $ref: '#/components/requestBodies/OrderCreateRequestV2' }
      responses:
        '201': { $ref: '#/components/responses/OrderCreated' }
        '202': { $ref: '#/components/responses/CommandStatusInProgress' }
        '400': { $ref: '#/components/responses/Problem400Mutation' }
        '401': { $ref: '#/components/responses/Problem401Mutation' }
        '403': { $ref: '#/components/responses/Problem403Mutation' }
        '404': { $ref: '#/components/responses/Problem404Mutation' }
        '409': { $ref: '#/components/responses/Problem409Mutation' }
        '428': { $ref: '#/components/responses/Problem428Mutation' }
        '429': { $ref: '#/components/responses/Problem429Mutation' }
        '500': { $ref: '#/components/responses/Problem500Mutation' }
        '502': { $ref: '#/components/responses/Problem502' }
        '503': { $ref: '#/components/responses/Problem503' }
  /orders/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      tags: [orders]
      operationId: getOrderV2
      parameters: [{ $ref: '#/components/parameters/RequestIdHeader' }]
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
        '502': { $ref: '#/components/responses/Problem502' }
        '503': { $ref: '#/components/responses/Problem503' }
    patch:
      tags: [orders]
      operationId: updateOrderV2
      description: Complete replacement edit. Only DRAFT orders at INITIAL_CONTACT, QUOTING, or QUOTE_FOLLOW_UP may be edited. Existing line IDs omitted from the replacement are removed; new lines use lineId null.
      x-order-edit: { stages: [INITIAL_CONTACT, QUOTING, QUOTE_FOLLOW_UP], status: DRAFT, replacement: complete-ordered, metadata: complete-when-present, snapshots: append-and-repoint, imageReuse: forbidden, unknownResult: recovery }
      x-safety: { csrf: required, idempotency: required, ifMatch: required }
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { $ref: '#/components/parameters/IdempotencyHeader' }
        - { $ref: '#/components/parameters/IfMatchHeader' }
        - { $ref: '#/components/parameters/RequestIdHeader' }
      requestBody: { $ref: '#/components/requestBodies/OrderUpdateRequestV2' }
      responses:
        '200': { $ref: '#/components/responses/OrderUpdated' }
        '202': { $ref: '#/components/responses/CommandStatusInProgress' }
        '400': { $ref: '#/components/responses/Problem400Mutation' }
        '401': { $ref: '#/components/responses/Problem401Mutation' }
        '403': { $ref: '#/components/responses/Problem403Mutation' }
        '404': { $ref: '#/components/responses/Problem404Mutation' }
        '409': { $ref: '#/components/responses/Problem409Mutation' }
        '428': { $ref: '#/components/responses/Problem428Mutation' }
        '429': { $ref: '#/components/responses/Problem429Mutation' }
        '500': { $ref: '#/components/responses/Problem500Mutation' }
        '502': { $ref: '#/components/responses/Problem502' }
        '503': { $ref: '#/components/responses/Problem503' }
  /orders/{id}/transitions:
    post:
      tags: [orders]
      operationId: transitionOrderV2
      description: Adjacent stage advance or terminal cancellation. CANCEL preserves the last stage and overrides status to CANCELLED.
      x-order-transition: { advance: adjacent-only, cancel: terminal, terminalStatuses: [CANCELLED, FULFILLED], terminalStages: [CLOSED], capabilityEnum: [order.update, order.transition], allowedOrder: [ADVANCE, CANCEL] }
      x-safety: { csrf: required, idempotency: required, ifMatch: required }
      parameters:
        - { $ref: '#/components/parameters/ResourceId' }
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { $ref: '#/components/parameters/IdempotencyHeader' }
        - { $ref: '#/components/parameters/IfMatchHeader' }
        - { $ref: '#/components/parameters/RequestIdHeader' }
      requestBody: { $ref: '#/components/requestBodies/OrderTransitionRequestV2' }
      responses:
        '200': { $ref: '#/components/responses/OrderUpdated' }
        '202': { $ref: '#/components/responses/CommandStatusInProgress' }
        '400': { $ref: '#/components/responses/Problem400Mutation' }
        '401': { $ref: '#/components/responses/Problem401Mutation' }
        '403': { $ref: '#/components/responses/Problem403Mutation' }
        '404': { $ref: '#/components/responses/Problem404Mutation' }
        '409': { $ref: '#/components/responses/Problem409Mutation' }
        '428': { $ref: '#/components/responses/Problem428Mutation' }
        '429': { $ref: '#/components/responses/Problem429Mutation' }
        '500': { $ref: '#/components/responses/Problem500Mutation' }
        '502': { $ref: '#/components/responses/Problem502' }
        '503': { $ref: '#/components/responses/Problem503' }
  /files/{fileId}:
    get:
      tags: [files]
      operationId: getFileStatusV2
      description: Files-owned status/read support surface. This is not a download endpoint.
      parameters:
        - { $ref: '#/components/parameters/FileId' }
        - { $ref: '#/components/parameters/RequestIdHeader' }
      responses:
        '200': { $ref: '#/components/responses/FileStatus' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
        '502': { $ref: '#/components/responses/Problem502' }
        '503': { $ref: '#/components/responses/Problem503' }
  /files/{fileId}/download-intents:
    post:
      tags: [files]
      operationId: createFileDownloadIntentV2
      description: Files-owned short-lived download intent. Upload and complete-upload remain v1 operations.
      x-safety: { csrf: required, idempotency: exempt, ifMatch: exempt }
      parameters:
        - { $ref: '#/components/parameters/FileId' }
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { $ref: '#/components/parameters/RequestIdHeader' }
      responses:
        '200': { $ref: '#/components/responses/FileDownloadIntent' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
        '502': { $ref: '#/components/responses/Problem502' }
        '503': { $ref: '#/components/responses/Problem503' }
components:
  securitySchemes:
    CookieSession: { type: apiKey, in: cookie, name: session_id }
  parameters:
    ResourceId: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    OrderId: { name: orderId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    FileId: { name: fileId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    CsrfHeader: { name: X-CSRF-Token, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 512 } }
    IdempotencyHeader: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[\x21-\x7E]+$' } }
    IfMatchHeader: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"v[1-9][0-9]*"$' } }
    RequestIdHeader: { name: X-Request-ID, in: header, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
    CommandOperationHeader: { name: X-Command-Operation, in: header, required: true, schema: { type: string, pattern: '^(create|update|transition)(Product|Sku|Order)V2$' } }
    PageAfter: { name: 'page[after]', in: query, required: false, schema: { $ref: '#/components/schemas/CursorV2' } }
    PageSize: { name: 'page[size]', in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    ProductSort: { name: sort, in: query, required: false, schema: { $ref: '#/components/schemas/ProductSortV2' } }
    SkuSort: { name: sort, in: query, required: false, schema: { $ref: '#/components/schemas/SkuSortV2' } }
    OrderSort: { name: sort, in: query, required: false, schema: { $ref: '#/components/schemas/OrderSortV2' } }
    ProductStatusFilter: { name: 'filter[status]', in: query, required: false, schema: { type: string, enum: [ACTIVE, INACTIVE] } }
    SkuStatusFilter: { name: 'filter[status]', in: query, required: false, schema: { type: string, enum: [ACTIVE, INACTIVE] } }
    OrderStatusFilter: { name: 'filter[status]', in: query, required: false, schema: { type: string, enum: [DRAFT, CONFIRMED, FULFILLED, CANCELLED] } }
  requestBodies:
    ProductCreateRequestV2: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductCreateRequestV2' } } } }
    ProductUpdateRequestV2: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductUpdateRequestV2' } } } }
    SkuCreateRequestV2: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SkuCreateRequestV2' } } } }
    SkuUpdateRequestV2: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SkuUpdateRequestV2' } } } }
    OrderCreateRequestV2: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderCreateRequestV2' } } } }
    OrderUpdateRequestV2: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderUpdateRequestV2' } } } }
    OrderTransitionRequestV2: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderTransitionRequestV2' } } } }
  headers:
    RequestId: { required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ETag: { required: true, schema: { type: string, pattern: '^"v[1-9][0-9]*"$' } }
    Location: { required: true, schema: { type: string, pattern: "^/api/v2/[A-Za-z0-9._~!$&'()*+,;=:@/-]+$" } }
    ContentLocation: { required: false, schema: { type: string, pattern: "^/api/v2/[A-Za-z0-9._~!$&'()*+,;=:@/-]+$" } }
    CommandStatusContentLocation: { required: true, schema: { type: string, const: /api/v2/commands/status } }
    CacheControl: { required: true, schema: { type: string, const: no-store } }
    IdempotentReplay: { required: false, schema: { type: string, enum: ['true'] } }
    RetryAfter: { required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
  responses:
