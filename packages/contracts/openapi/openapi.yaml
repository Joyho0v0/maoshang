openapi: 3.1.0
info:
  title: Autoflow CRM API
  version: 0.1.0
  description: Non-production Joint Contract v1 plus JC1-IS01 implementation supplement.
  x-contract-version: JC1-v1+JC1-IS01
servers:
  - url: /api/v1
    description: Versioned API base path; deployment host is intentionally unspecified.
tags:
  - name: auth
  - name: commands
  - name: identity
  - name: customers
  - name: catalog
  - name: orders
  - name: inventory
  - name: payments
  - name: files
  - name: documents
  - name: operations
  - name: audit
paths:
  /auth/csrf:
    get:
      tags: [auth]
      operationId: getCsrfToken
      responses:
        '200': { $ref: '#/components/responses/CsrfToken' }
  /auth/sessions:
    post:
      tags: [auth]
      operationId: createSession
      x-safety: { csrf: required, idempotency: exempt, ifMatch: exempt }
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { $ref: '#/components/requestBodies/SessionRequest' }
      responses:
        '201': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /auth/sessions/current:
    get:
      tags: [auth]
      operationId: getCurrentSession
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [auth]
      operationId: deleteCurrentSession
      x-safety: { csrf: required, idempotency: exempt, ifMatch: exempt }
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '204': { description: Session deleted. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /commands/status:
    get:
      tags: [commands]
      operationId: getCommandStatus
      parameters:
        - { $ref: '#/components/parameters/IdempotencyHeader' }
        - { $ref: '#/components/parameters/CommandOperationHeader' }
      responses:
        '200': { $ref: '#/components/responses/CommandStatus' }
        '404': { $ref: '#/components/responses/CommandNotFound' }

  /users/{id}:
    get: { $ref: '#/x-operationTemplates/getUser' }
  /organizations/{id}/users:
    post:
      tags: [identity]
      operationId: createUser
      x-safety: { csrf: required, idempotency: required, ifMatch: exempt }
      parameters:
        - { $ref: '#/components/parameters/ResourceId' }
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { $ref: '#/components/parameters/IdempotencyHeader' }
        - { $ref: '#/components/parameters/RequestIdHeader' }
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '201': { $ref: '#/components/responses/Resource' }
        '202': { $ref: '#/components/responses/CommandStatus' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '409': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /users/{id}/role-bindings:
    put:
      tags: [identity]
      operationId: updateUserRoleBindings
      x-safety: { csrf: required, idempotency: required, ifMatch: required }
      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/CsrfHeader' }, { $ref: '#/components/parameters/IdempotencyHeader' }, { $ref: '#/components/parameters/IfMatchHeader' }]
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses: { '200': { $ref: '#/components/responses/Resource' }, '202': { $ref: '#/components/responses/CommandStatus' }, '403': { $ref: '#/components/responses/CsrfFailed' }, '409': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/PreconditionRequired' } }
  /users/{id}/data-scope-grants:
    put:
      tags: [identity]
      operationId: updateUserDataScopeGrants
      x-safety: { csrf: required, idempotency: required, ifMatch: required }
      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/CsrfHeader' }, { $ref: '#/components/parameters/IdempotencyHeader' }, { $ref: '#/components/parameters/IfMatchHeader' }]
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses: { '200': { $ref: '#/components/responses/Resource' }, '202': { $ref: '#/components/responses/CommandStatus' }, '403': { $ref: '#/components/responses/CsrfFailed' }, '409': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/PreconditionRequired' } }
  /users/{id}/disable:
    post:
      tags: [identity]
      operationId: disableUser
      x-safety: { csrf: required, idempotency: required, ifMatch: required }
      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/CsrfHeader' }, { $ref: '#/components/parameters/IdempotencyHeader' }, { $ref: '#/components/parameters/IfMatchHeader' }]
      responses: { '202': { $ref: '#/components/responses/CommandStatus' }, '403': { $ref: '#/components/responses/CsrfFailed' }, '409': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/PreconditionRequired' } }

  /customers:
    get: { $ref: '#/x-operationTemplates/listCustomers' }
    post:
      tags: [customers]
      operationId: createCustomer
      x-safety: { csrf: required, idempotency: required, ifMatch: exempt }
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }, { $ref: '#/components/parameters/IdempotencyHeader' }, { $ref: '#/components/parameters/RequestIdHeader' }]
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses: { '201': { $ref: '#/components/responses/Customer' }, '202': { $ref: '#/components/responses/CommandStatus' }, '403': { $ref: '#/components/responses/CsrfFailed' }, '409': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/PreconditionRequired' } }
  /customers/{id}:
    get: { $ref: '#/x-operationTemplates/getCustomer' }
    patch:
      tags: [customers]
      operationId: updateCustomer
      x-safety: { csrf: required, idempotency: required, ifMatch: required }
      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/CsrfHeader' }, { $ref: '#/components/parameters/IdempotencyHeader' }, { $ref: '#/components/parameters/IfMatchHeader' }]
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses: { '200': { $ref: '#/components/responses/Customer' }, '202': { $ref: '#/components/responses/CommandStatus' }, '403': { $ref: '#/components/responses/CsrfFailed' }, '409': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/PreconditionRequired' } }
  /customers/{id}/submit-approval:
    post:
      $ref: '#/x-operationTemplates/customerCommand'
      operationId: submitCustomerApproval
  /customers/{id}/approve:
    post:
      $ref: '#/x-operationTemplates/customerCommand'
      operationId: approveCustomer
  /customers/{id}/reject:
    post:
      $ref: '#/x-operationTemplates/customerCommand'
      operationId: rejectCustomer
  /customers/{id}/reassign:
    post:
      $ref: '#/x-operationTemplates/customerCommand'
      operationId: reassignCustomer

  /products:
    get: { $ref: '#/x-operationTemplates/listProducts' }
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: createProduct
  /products/{id}:
    get: { $ref: '#/x-operationTemplates/getProduct' }
    patch:
      $ref: '#/x-operationTemplates/updateResource'
      operationId: updateProduct
  /skus:
    get: { $ref: '#/x-operationTemplates/listSkus' }
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: createSku
  /skus/{id}:
    get: { $ref: '#/x-operationTemplates/getSku' }
    patch:
      $ref: '#/x-operationTemplates/updateResource'
      operationId: updateSku

  /orders:
    get: { $ref: '#/x-operationTemplates/listOrders' }
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: createOrder
  /orders/{id}:
    get: { $ref: '#/x-operationTemplates/getOrder' }
    patch:
      $ref: '#/x-operationTemplates/updateResource'
      operationId: updateOrder
  /orders/{id}/transitions:
    post:
      $ref: '#/x-operationTemplates/orderCommand'
      operationId: transitionOrder

  /inventory/balances:
    get:
      $ref: '#/x-operationTemplates/listInventory'
      operationId: listInventoryBalances
  /inventory/movements:
    get:
      $ref: '#/x-operationTemplates/listInventory'
      operationId: listInventoryMovements
  /inventory/reservations:
    get:
      $ref: '#/x-operationTemplates/listInventory'
      operationId: listInventoryReservations
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: createInventoryReservation
  /inventory/reservations/{id}:
    get: { $ref: '#/x-operationTemplates/getInventory' }
  /inventory/reservations/{id}/release:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: releaseInventoryReservation
  /inventory/observations:
    get:
      $ref: '#/x-operationTemplates/listInventory'
      operationId: listInventoryObservations
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: createInventoryObservation
  /inventory/operations/{id}:
    get: { $ref: '#/x-operationTemplates/getInventoryOperation' }
  /inventory/initial-receipts:
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: createInitialReceipt
  /inventory/receipts:
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: createInventoryReceipt
  /inventory/adjustments:
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: createInventoryAdjustment
  /inventory/issues:
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: issueInventory
  /inventory/operations/{operationId}/reverse:
    post:
      tags: [inventory]
      operationId: reverseInventoryOperation
      x-safety: { csrf: required, idempotency: required, ifMatch: required }
      parameters: [{ $ref: '#/components/parameters/OperationId' }, { $ref: '#/components/parameters/CsrfHeader' }, { $ref: '#/components/parameters/IdempotencyHeader' }, { $ref: '#/components/parameters/IfMatchHeader' }]
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses: { '201': { $ref: '#/components/responses/InventoryOperation' }, '202': { $ref: '#/components/responses/CommandStatus' }, '403': { $ref: '#/components/responses/CsrfFailed' }, '409': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/PreconditionRequired' } }

  /payments:
    get: { $ref: '#/x-operationTemplates/listPayments' }
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: createPayment
  /payments/{id}:
    get: { $ref: '#/x-operationTemplates/getPayment' }
  /payments/{id}/proofs:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: attachPaymentProof
  /payments/{id}/submit-review:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: submitPaymentReview
  /payments/{id}/review:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: reviewPayment
  /payments/{id}/reverse:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: reversePayment

  /files/{id}:
    get: { $ref: '#/x-operationTemplates/getFile' }
  /files/upload-intents:
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: createUploadIntent
  /files/{id}/complete:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: completeUpload
  /files/{id}/download-intents:
    post:
      tags: [files]
      operationId: createDownloadIntent
      x-safety: { csrf: required, idempotency: exempt, ifMatch: exempt }
      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/CsrfHeader' }]
      responses: { '201': { $ref: '#/components/responses/Resource' }, '403': { $ref: '#/components/responses/CsrfFailed' }, '404': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/PreconditionRequired' } }

  /orders/{orderId}/documents:
    get: { $ref: '#/x-operationTemplates/listDocuments' }
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: createDocument
  /documents/{id}:
    get: { $ref: '#/x-operationTemplates/getDocument' }
    patch:
      $ref: '#/x-operationTemplates/updateResource'
      operationId: updateDocument
  /documents/{id}/versions:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: createDocumentVersion
  /documents/{id}/submit:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: submitDocument
  /documents/{id}/approve:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: approveDocument
  /documents/{id}/reject:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: rejectDocument
  /documents/{id}/finalize:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: finalizeDocument
  /documents/{id}/issue:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: issueDocument
  /documents/{id}/void:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: voidDocument

  /tasks:
    get: { $ref: '#/x-operationTemplates/listTasks' }
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: createTask
  /tasks/{id}:
    get: { $ref: '#/x-operationTemplates/getTask' }
  /tasks/{id}/complete:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: completeTask
  /audit-events:
    get: { $ref: '#/x-operationTemplates/listAudit' }

components:
  parameters:
    ResourceId: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    OperationId: { name: operationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    CsrfHeader: { name: X-CSRF-Token, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 512 } }
    IdempotencyHeader: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[\x21-\x7E]+$' } }
    IfMatchHeader: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"v[1-9][0-9]*"$' } }
    RequestIdHeader: { name: X-Request-ID, in: header, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
    CommandOperationHeader: { name: X-Command-Operation, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
  requestBodies:
    JsonObject:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/JsonObject' } } }
    SessionRequest:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/SessionRequest' } } }
  responses:
    Resource: { description: A resource or command result., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }
    Customer: { description: Customer resource., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
    Session: { description: Session resource., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
    CsrfToken: { description: Session-bound CSRF token., headers: { Cache-Control: { schema: { type: string, const: no-store } } }, content: { application/json: { schema: { $ref: '#/components/schemas/CsrfToken' } } } }
    CommandStatus: { description: Authoritative idempotent command state., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Retry-After: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/CommandStatus' } } } }
    InventoryOperation: { description: Inventory operation resource., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryOperation' } } } }
    Problem: { description: RFC 9457 problem response., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    CsrfFailed: { description: CSRF is missing or invalid before side effects., content: { application/problem+json: { schema: { $ref: '#/components/schemas/CsrfFailedProblem' } } } }
    PreconditionRequired: { description: A required If-Match or Idempotency-Key header is missing., content: { application/problem+json: { schema: { $ref: '#/components/schemas/PreconditionRequiredProblem' } } } }
    CommandNotFound: { description: Command is not visible to this actor., content: { application/problem+json: { schema: { $ref: '#/components/schemas/CommandNotFoundProblem' } } } }
  headers:
    RequestId: { description: Correlation identifier., schema: { $ref: '#/components/schemas/Uuid' } }
    ETag: { description: Strong aggregate version tag., schema: { type: string, pattern: '^"v[1-9][0-9]*"$' } }
  schemas:
    Uuid: { type: string, format: uuid }
    DecimalString: { type: string, pattern: '^-?\d+(\.\d+)?$' }
    JsonObject: { type: object, additionalProperties: true }
    Money:
      type: object
      required: [amount, currency]
      properties: { amount: { $ref: '#/components/schemas/DecimalString' }, currency: { type: string, pattern: '^[A-Z]{3}$' } }
      additionalProperties: false
    Quantity:
      type: object
      required: [value, unit]
      properties: { value: { $ref: '#/components/schemas/DecimalString' }, unit: { type: string, minLength: 1, maxLength: 32 } }
      additionalProperties: false
    ResourceMeta:
      type: object
      required: [id, organizationId, version, createdAt, updatedAt]
      properties: { id: { $ref: '#/components/schemas/Uuid' }, organizationId: { $ref: '#/components/schemas/Uuid' }, version: { type: integer, minimum: 1 }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
      additionalProperties: false
    Resource:
      type: object
      required: [id, version]
      properties: { id: { $ref: '#/components/schemas/Uuid' }, version: { type: integer, minimum: 1 }, href: { type: string, pattern: '^/api/v1/' }, data: { $ref: '#/components/schemas/JsonObject' } }
      additionalProperties: true
    Capability: { type: string, pattern: '^[a-z][a-z0-9.:-]{1,127}$' }
    SessionRequest:
      type: object
      required: [provider]
      properties: { provider: { type: string, enum: [LOCAL_PASSWORD, OIDC_SSO] }, username: { type: string, minLength: 1, maxLength: 320 }, password: { type: string, minLength: 1, maxLength: 1024 }, authorizationCode: { type: string, minLength: 1, maxLength: 4096 } }
      additionalProperties: false
    Session:
      type: object
      required: [user, capabilities, scopeSummary, csrfToken]
      properties: { user: { $ref: '#/components/schemas/Resource' }, capabilities: { type: array, items: { $ref: '#/components/schemas/Capability' } }, scopeSummary: { $ref: '#/components/schemas/JsonObject' }, csrfToken: { type: string, minLength: 16 }, authzVersion: { type: integer, minimum: 1 }, sessionEpoch: { type: integer, minimum: 1 } }
      additionalProperties: false
    CsrfToken:
      type: object
      required: [csrfToken, expiresAt]
      properties: { csrfToken: { type: string, minLength: 16 }, expiresAt: { type: string, format: date-time } }
      additionalProperties: false
    ProblemViolation:
      type: object
      required: [field, code, message]
      properties: { field: { type: string, maxLength: 256 }, code: { type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$' }, message: { type: string, maxLength: 500 } }
      additionalProperties: true
    VersionConflictMeta:
      type: object
      required: [currentVersion, currentEtag, resourceHref]
      properties: { currentVersion: { type: integer, minimum: 1 }, currentEtag: { type: string, pattern: '^"v[1-9][0-9]*"$' }, resourceHref: { type: string, pattern: '^/api/v1/' } }
      additionalProperties: false
    InventoryShortage:
      type: object
      required: [skuId, requested, available, unit]
      properties: { skuId: { $ref: '#/components/schemas/Uuid' }, requested: { $ref: '#/components/schemas/DecimalString' }, available: { $ref: '#/components/schemas/DecimalString' }, unit: { type: string } }
      additionalProperties: false
    InventoryInsufficientMeta:
      type: object
      required: [shortages]
      properties: { shortages: { type: array, minItems: 1, items: { $ref: '#/components/schemas/InventoryShortage' } } }
      additionalProperties: false
    ReversalViolation:
      type: object
      required: [skuId, locationId, onHand, reserved, delta, unit]
      properties: { skuId: { $ref: '#/components/schemas/Uuid' }, locationId: { $ref: '#/components/schemas/Uuid' }, onHand: { $ref: '#/components/schemas/DecimalString' }, reserved: { $ref: '#/components/schemas/DecimalString' }, delta: { $ref: '#/components/schemas/DecimalString' }, unit: { type: string } }
      additionalProperties: false
    ReversalInvariantMeta:
      type: object
      required: [violations]
      properties: { violations: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ReversalViolation' } } }
      additionalProperties: false
    CustomerApprovalConflictMeta:
      type: object
      required: [customerId, currentCustomerStatus, currentVersion]
      properties: { customerId: { $ref: '#/components/schemas/Uuid' }, currentCustomerStatus: { type: string, enum: [DRAFT, PENDING_APPROVAL, APPROVED, INACTIVE] }, currentApprovalAttemptId: { $ref: '#/components/schemas/Uuid' }, currentVersion: { type: integer, minimum: 1 } }
      additionalProperties: false
    Problem:
      type: object
      required: [type, title, status, code, requestId, retryable]
      properties:
        type: { type: string, format: uri }
        title: { type: string, minLength: 1, maxLength: 200 }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, maxLength: 2048 }
        instance: { type: string, format: uri-reference }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$' }
        requestId: { $ref: '#/components/schemas/Uuid' }
        traceId: { type: string, maxLength: 128 }
        retryable: { type: boolean }
        violations: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ProblemViolation' } }
        meta: { type: object, additionalProperties: true }
      additionalProperties: true
    CsrfFailedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties: { status: { const: 403 }, code: { const: CSRF_FAILED }, meta: { type: object, required: [refreshHref], properties: { refreshHref: { const: /api/v1/auth/csrf } } } }
    PreconditionRequiredProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties: { status: { const: 428 }, code: { const: PRECONDITION_REQUIRED } }
    CommandNotFoundProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties: { status: { const: 404 }, code: { const: COMMAND_NOT_FOUND } }
    TypedProblemMeta:
      oneOf: [{ $ref: '#/components/schemas/VersionConflictMeta' }, { $ref: '#/components/schemas/InventoryInsufficientMeta' }, { $ref: '#/components/schemas/ReversalInvariantMeta' }, { $ref: '#/components/schemas/CustomerApprovalConflictMeta' }]
    CommandStatusBase:
      type: object
      required: [commandId, operationId, state, startedAt, completedAt, expiresAt, retryAfterMs, httpStatus, resource, resultHref, problem]
