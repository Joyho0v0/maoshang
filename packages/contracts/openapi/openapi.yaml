openapi: 3.1.0
info:
  title: Autoflow CRM API
  version: 0.1.0
  description: Non-production Joint Contract v1 plus JC1-IS01 implementation supplement.
  x-contract-version: JC1-v1+JC1-IS01
servers:
  - url: /api/v1
    description: Versioned API base path; deployment host is intentionally unspecified.
security:
  - CookieSession: []
tags:
  - name: auth
  - name: commands
  - name: identity
  - name: customers
  - name: catalog
  - name: orders
  - name: inventory
  - name: payments
  - name: files
  - name: documents
  - name: operations
  - name: audit
paths:
  /auth/csrf:
    get:
      security: []
      tags: [auth]
      operationId: getCsrfToken
      responses:
        '200': { $ref: '#/components/responses/CsrfToken' }
  /auth/sessions:
    post:
      security: []
      tags: [auth]
      operationId: createSession
      x-safety: { csrf: required, idempotency: exempt, ifMatch: exempt }
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { $ref: '#/components/requestBodies/SessionRequest' }
      responses:
        '201': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
  /auth/sessions/current:
    get:
      tags: [auth]
      operationId: getCurrentSession
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [auth]
      operationId: deleteCurrentSession
      x-safety: { csrf: required, idempotency: exempt, ifMatch: exempt }
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '204': { description: Session deleted. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
  /commands/status:
    get:
      tags: [commands]
      operationId: getCommandStatus
      parameters:
        - { $ref: '#/components/parameters/IdempotencyHeader' }
        - { $ref: '#/components/parameters/CommandOperationHeader' }
      responses:
        '200': { $ref: '#/components/responses/CommandStatus' }
        '404': { $ref: '#/components/responses/CommandNotFound' }

  /users/{id}:
    get: { $ref: '#/x-operationTemplates/getUser' }
  /organizations/{id}/users:
    post:
      tags: [identity]
      operationId: createUser
      x-safety: { csrf: required, idempotency: required, ifMatch: exempt }
      parameters:
        - { $ref: '#/components/parameters/ResourceId' }
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { $ref: '#/components/parameters/IdempotencyHeader' }
        - { $ref: '#/components/parameters/RequestIdHeader' }
      requestBody: { $ref: '#/components/requestBodies/UserCreateRequest' }
      responses:
        '201': { $ref: '#/components/responses/User' }
        '202': { $ref: '#/components/responses/CommandStatus' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '409': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /users/{id}/role-bindings:
    put:
      tags: [identity]
      operationId: updateUserRoleBindings
      x-safety: { csrf: required, idempotency: required, ifMatch: required }
      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/CsrfHeader' }, { $ref: '#/components/parameters/IdempotencyHeader' }, { $ref: '#/components/parameters/IfMatchHeader' }]
      requestBody: { $ref: '#/components/requestBodies/RoleBindingsUpdateRequest' }
      responses: { '200': { $ref: '#/components/responses/User' }, '202': { $ref: '#/components/responses/CommandStatus' }, '403': { $ref: '#/components/responses/CsrfFailed' }, '409': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/PreconditionRequired' } }
  /users/{id}/data-scope-grants:
    put:
      tags: [identity]
      operationId: updateUserDataScopeGrants
      x-safety: { csrf: required, idempotency: required, ifMatch: required }
      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/CsrfHeader' }, { $ref: '#/components/parameters/IdempotencyHeader' }, { $ref: '#/components/parameters/IfMatchHeader' }]
      requestBody: { $ref: '#/components/requestBodies/DataScopeUpdateRequest' }
      responses: { '200': { $ref: '#/components/responses/User' }, '202': { $ref: '#/components/responses/CommandStatus' }, '403': { $ref: '#/components/responses/CsrfFailed' }, '409': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/PreconditionRequired' } }
  /users/{id}/disable:
    post:
      tags: [identity]
      operationId: disableUser
      x-safety: { csrf: required, idempotency: required, ifMatch: required }
      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/CsrfHeader' }, { $ref: '#/components/parameters/IdempotencyHeader' }, { $ref: '#/components/parameters/IfMatchHeader' }]
      responses: { '202': { $ref: '#/components/responses/CommandStatus' }, '403': { $ref: '#/components/responses/CsrfFailed' }, '409': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/PreconditionRequired' } }

  /customers:
    get: { $ref: '#/x-operationTemplates/listCustomers' }
    post:
      tags: [customers]
      operationId: createCustomer
      x-safety: { csrf: required, idempotency: required, ifMatch: exempt }
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }, { $ref: '#/components/parameters/IdempotencyHeader' }, { $ref: '#/components/parameters/RequestIdHeader' }]
      requestBody: { $ref: '#/components/requestBodies/CustomerCreateRequest' }
      responses: { '201': { $ref: '#/components/responses/Customer' }, '202': { $ref: '#/components/responses/CommandStatus' }, '403': { $ref: '#/components/responses/CsrfFailed' }, '409': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/PreconditionRequired' } }
  /customers/{id}:
    get: { $ref: '#/x-operationTemplates/getCustomer' }
    patch:
      tags: [customers]
      operationId: updateCustomer
      x-safety: { csrf: required, idempotency: required, ifMatch: required }
      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/CsrfHeader' }, { $ref: '#/components/parameters/IdempotencyHeader' }, { $ref: '#/components/parameters/IfMatchHeader' }]
      requestBody: { $ref: '#/components/requestBodies/CustomerUpdateRequest' }
      responses: { '200': { $ref: '#/components/responses/Customer' }, '202': { $ref: '#/components/responses/CommandStatus' }, '403': { $ref: '#/components/responses/CsrfFailed' }, '409': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/PreconditionRequired' } }
  /customers/{id}/submit-approval:
    post:
      $ref: '#/x-operationTemplates/customerCommand'
      operationId: submitCustomerApproval
  /customers/{id}/approve:
    post:
      $ref: '#/x-operationTemplates/customerCommand'
      operationId: approveCustomer
  /customers/{id}/reject:
    post:
      $ref: '#/x-operationTemplates/customerCommand'
      operationId: rejectCustomer
  /customers/{id}/reassign:
    post:
      $ref: '#/x-operationTemplates/customerCommand'
      operationId: reassignCustomer

  /products:
    get: { $ref: '#/x-operationTemplates/listProducts' }
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: createProduct
  /products/{id}:
    get: { $ref: '#/x-operationTemplates/getProduct' }
    patch:
      $ref: '#/x-operationTemplates/updateResource'
      operationId: updateProduct
  /skus:
    get: { $ref: '#/x-operationTemplates/listSkus' }
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: createSku
  /skus/{id}:
    get: { $ref: '#/x-operationTemplates/getSku' }
    patch:
      $ref: '#/x-operationTemplates/updateResource'
      operationId: updateSku

  /orders:
    get: { $ref: '#/x-operationTemplates/listOrders' }
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: createOrder
  /orders/{id}:
    get: { $ref: '#/x-operationTemplates/getOrder' }
    patch:
      $ref: '#/x-operationTemplates/updateResource'
      operationId: updateOrder
  /orders/{id}/transitions:
    post:
      $ref: '#/x-operationTemplates/orderCommand'
      operationId: transitionOrder

  /inventory/balances:
    get:
      $ref: '#/x-operationTemplates/listInventory'
      operationId: listInventoryBalances
  /inventory/movements:
    get:
      $ref: '#/x-operationTemplates/listInventory'
      operationId: listInventoryMovements
  /inventory/reservations:
    get:
      $ref: '#/x-operationTemplates/listInventory'
      operationId: listInventoryReservations
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: createInventoryReservation
  /inventory/reservations/{id}:
    get: { $ref: '#/x-operationTemplates/getInventory' }
  /inventory/reservations/{id}/release:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: releaseInventoryReservation
  /inventory/observations:
    get:
      $ref: '#/x-operationTemplates/listInventory'
      operationId: listInventoryObservations
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: createInventoryObservation
  /inventory/operations/{id}:
    get: { $ref: '#/x-operationTemplates/getInventoryOperation' }
  /inventory/initial-receipts:
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: createInitialReceipt
  /inventory/receipts:
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: createInventoryReceipt
  /inventory/adjustments:
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: createInventoryAdjustment
  /inventory/issues:
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: issueInventory
  /inventory/operations/{operationId}/reverse:
    post:
      tags: [inventory]
      operationId: reverseInventoryOperation
      x-safety: { csrf: required, idempotency: required, ifMatch: required }
      parameters: [{ $ref: '#/components/parameters/OperationId' }, { $ref: '#/components/parameters/CsrfHeader' }, { $ref: '#/components/parameters/IdempotencyHeader' }, { $ref: '#/components/parameters/IfMatchHeader' }]
      requestBody: { $ref: '#/components/requestBodies/InventoryCommandRequest' }
      responses: { '201': { $ref: '#/components/responses/InventoryOperation' }, '202': { $ref: '#/components/responses/CommandStatus' }, '403': { $ref: '#/components/responses/CsrfFailed' }, '409': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/PreconditionRequired' } }

  /payments:
    get: { $ref: '#/x-operationTemplates/listPayments' }
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: createPayment
  /payments/{id}:
    get: { $ref: '#/x-operationTemplates/getPayment' }
  /payments/{id}/proofs:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: attachPaymentProof
  /payments/{id}/submit-review:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: submitPaymentReview
  /payments/{id}/review:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: reviewPayment
  /payments/{id}/reverse:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: reversePayment

  /files/{id}:
    get: { $ref: '#/x-operationTemplates/getFile' }
  /files/upload-intents:
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: createUploadIntent
  /files/{id}/complete:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: completeUpload
  /files/{id}/download-intents:
    post:
      tags: [files]
      operationId: createDownloadIntent
      x-safety: { csrf: required, idempotency: exempt, ifMatch: exempt }
      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/CsrfHeader' }]
      responses: { '201': { $ref: '#/components/responses/Resource' }, '403': { $ref: '#/components/responses/CsrfFailed' }, '404': { $ref: '#/components/responses/Problem' } }

  /orders/{orderId}/documents:
    get: { $ref: '#/x-operationTemplates/listDocuments' }
    post:
      $ref: '#/x-operationTemplates/createDocument'
      operationId: createDocument
  /documents/{id}:
    get: { $ref: '#/x-operationTemplates/getDocument' }
    patch:
      $ref: '#/x-operationTemplates/updateResource'
      operationId: updateDocument
  /documents/{id}/versions:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: createDocumentVersion
  /documents/{id}/submit:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: submitDocument
  /documents/{id}/approve:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: approveDocument
  /documents/{id}/reject:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: rejectDocument
  /documents/{id}/finalize:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: finalizeDocument
  /documents/{id}/issue:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: issueDocument
  /documents/{id}/void:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: voidDocument

  /tasks:
    get: { $ref: '#/x-operationTemplates/listTasks' }
    post:
      $ref: '#/x-operationTemplates/createResource'
      operationId: createTask
  /tasks/{id}:
    get: { $ref: '#/x-operationTemplates/getTask' }
  /tasks/{id}/complete:
    post:
      $ref: '#/x-operationTemplates/updateCommand'
      operationId: completeTask
  /audit-events:
    get: { $ref: '#/x-operationTemplates/listAudit' }

components:
  securitySchemes:
    CookieSession:
      type: apiKey
      in: cookie
      name: session_id
  parameters:
    ResourceId: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    OperationId: { name: operationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    CsrfHeader: { name: X-CSRF-Token, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 512 } }
    IdempotencyHeader: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[\x21-\x7E]+$' } }
    IfMatchHeader: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"v[1-9][0-9]*"$' } }
    RequestIdHeader: { name: X-Request-ID, in: header, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
    CommandOperationHeader: { name: X-Command-Operation, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
    Cursor: { name: cursor, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 512 } }
    PageSize: { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    Sort: { name: sort, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 256 } }
    Filter: { name: filter, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 2048 } }
  requestBodies:
    JsonObject:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/JsonObject' } } }
    SessionRequest:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/SessionRequest' } } }
    UserCreateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserCreateRequest' } } } }
    RoleBindingsUpdateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleBindingsUpdateRequest' } } } }
    DataScopeUpdateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DataScopeUpdateRequest' } } } }
    CustomerCreateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerCreateRequest' } } } }
    CustomerUpdateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerUpdateRequest' } } } }
    CustomerCommandRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerCommandRequest' } } } }
    InventoryCommandRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryCommandRequest' } } } }
    ResourceCreateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceCreateRequest' } } } }
    ResourceUpdateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceUpdateRequest' } } } }
    ResourceCommandRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceCommandRequest' } } } }
    DocumentCreateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentCreateRequest' } } } }
  responses:
    Resource: { description: A typed resource envelope., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, ETag: { $ref: '#/components/headers/ETag' }, Location: { $ref: '#/components/headers/Location' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }
    PageResource: { description: Cursor-paginated typed resources., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/PageResource' } } } }
    User: { description: User resource., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
    Customer: { description: Customer resource., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
    Session: { description: Session resource., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
    CsrfToken: { description: Session-bound CSRF token., headers: { Cache-Control: { schema: { type: string, const: no-store } } }, content: { application/json: { schema: { $ref: '#/components/schemas/CsrfToken' } } } }
    CommandStatus: { description: Authoritative idempotent command state., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Retry-After: { schema: { type: string } }, Cache-Control: { schema: { type: string, const: no-store } }, Idempotent-Replay: { $ref: '#/components/headers/IdempotentReplay' }, Content-Location: { $ref: '#/components/headers/ContentLocation' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CommandStatus' } } } }
    InventoryOperation: { description: Inventory operation resource., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryOperation' } } } }
    Problem:
      description: RFC 9457 problem response.
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            KeyReused: { $ref: '#/components/examples/KeyReused' }
            InventoryInsufficient: { $ref: '#/components/examples/InventoryInsufficient' }
            OperationAlreadyReversed: { $ref: '#/components/examples/OperationAlreadyReversed' }
            ReversalInvariant: { $ref: '#/components/examples/ReversalInvariant' }
            CustomerApprovalConflict: { $ref: '#/components/examples/CustomerApprovalConflict' }
    CsrfFailed:
      description: CSRF is missing or invalid before side effects.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/CsrfFailedProblem' }, examples: { CsrfFailed: { $ref: '#/components/examples/CsrfFailed' } } } }
    PreconditionRequired:
      description: A required If-Match or Idempotency-Key header is missing.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/PreconditionRequiredProblem' } } }
    CommandNotFound:
      description: Command is not visible to this actor.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/CommandNotFoundProblem' }, examples: { CommandNotFound: { $ref: '#/components/examples/CommandNotFound' } } } }
  headers:
    RequestId: { description: Correlation identifier., schema: { $ref: '#/components/schemas/Uuid' } }
    ETag: { description: Strong aggregate version tag., schema: { type: string, pattern: '^"v[1-9][0-9]*"$' } }
    Location: { description: Created resource location., schema: { $ref: '#/components/schemas/Href' } }
    ContentLocation: { description: Command status location., schema: { $ref: '#/components/schemas/Href' } }
    IdempotentReplay: { description: Indicates a terminal result replay., schema: { type: string, enum: ['true'] } }
  examples:
    InProgress: { value: { commandId: f8b6e3a9-3a0a-4c1c-b3e3-5d65d08c17e2, operationId: reviewPayment, state: IN_PROGRESS, startedAt: '2026-10-28T05:00:00Z', completedAt: null, expiresAt: '2026-10-29T05:00:00Z', retryAfterMs: 1000, httpStatus: null, resource: null, resultHref: null, problem: null } }
    RecoveryRequired: { value: { commandId: f8b6e3a9-3a0a-4c1c-b3e3-5d65d08c17e2, operationId: reviewPayment, state: RECOVERY_REQUIRED, startedAt: '2026-10-28T05:00:00Z', completedAt: null, expiresAt: '2026-10-29T05:00:00Z', retryAfterMs: 0, httpStatus: null, resource: null, resultHref: null, problem: null } }
    CommandNotFound: { value: { type: 'urn:autoflow:problem:command-not-found', title: Command not found, status: 404, code: COMMAND_NOT_FOUND, requestId: f8b6e3a9-3a0a-4c1c-b3e3-5d65d08c17e2, retryable: false } }
    KeyReused: { value: { type: 'urn:autoflow:problem:idempotency-key-reused', title: Idempotency key reused, status: 409, code: IDEMPOTENCY_KEY_REUSED, requestId: f8b6e3a9-3a0a-4c1c-b3e3-5d65d08c17e2, retryable: false, meta: { operationId: createCustomer, commandStatusHref: /api/v1/commands/status } } }
    CsrfFailed: { value: { type: 'urn:autoflow:problem:csrf-failed', title: CSRF failed, status: 403, code: CSRF_FAILED, requestId: f8b6e3a9-3a0a-4c1c-b3e3-5d65d08c17e2, retryable: true, meta: { refreshHref: /api/v1/auth/csrf } } }
    InventoryInsufficient: { value: { type: 'urn:autoflow:problem:inventory-insufficient', title: Inventory insufficient, status: 409, code: INVENTORY_INSUFFICIENT, requestId: f8b6e3a9-3a0a-4c1c-b3e3-5d65d08c17e2, retryable: false, meta: { shortages: [{ skuId: 2f6a6a3d-90e4-4ff8-b0f3-8a8225e7f019, requested: '3', available: '1', unit: PCS }] } } }
    OperationAlreadyReversed: { value: { type: 'urn:autoflow:problem:operation-already-reversed', title: Operation already reversed, status: 409, code: OPERATION_ALREADY_REVERSED, requestId: f8b6e3a9-3a0a-4c1c-b3e3-5d65d08c17e2, retryable: false, meta: { operationId: f8b6e3a9-3a0a-4c1c-b3e3-5d65d08c17e2, reversalOperationId: f8b6e3a9-3a0a-4c1c-b3e3-5d65d08c17e2, reversalHref: /api/v1/inventory/operations/f8b6e3a9-3a0a-4c1c-b3e3-5d65d08c17e2 } } }
