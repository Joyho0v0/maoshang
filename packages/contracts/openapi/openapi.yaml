openapi: 3.1.0
info:
  title: Autoflow CRM API
  version: 0.1.0
  description: Non-production Joint Contract v1 plus JC1-IS01 implementation supplement.
  x-contract-version: JC1-v1+JC1-IS01
servers:
  - url: /api/v1
    description: Versioned API base path; deployment host is intentionally unspecified.
security:
  - CookieSession: []
tags:
  - name: auth
  - name: commands
  - name: identity
  - name: customers
  - name: catalog
  - name: orders
  - name: inventory
  - name: payments
  - name: files
  - name: documents
  - name: operations
  - name: audit
paths:
  /auth/csrf:
    get:
      security: []
      tags: [auth]
      operationId: getCsrfToken
      responses:
        '200': { $ref: '#/components/responses/CsrfToken' }
  /auth/sessions:
    post:
      security: []
      tags: [auth]
      operationId: createSession
      x-safety: { csrf: required, idempotency: exempt, ifMatch: exempt }
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { $ref: '#/components/requestBodies/SessionRequest' }
      responses:
        '201': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
  /auth/sessions/current:
    get:
      tags: [auth]
      operationId: getCurrentSession
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [auth]
      operationId: deleteCurrentSession
      x-safety: { csrf: required, idempotency: exempt, ifMatch: exempt }
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '204': { description: Session deleted. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
  /commands/status:
    get:
      tags: [commands]
      operationId: getCommandStatus
      parameters:
        - { $ref: '#/components/parameters/IdempotencyHeader' }
        - { $ref: '#/components/parameters/CommandOperationHeader' }
      responses:
        '200': { $ref: '#/components/responses/CommandStatus' }
        '404': { $ref: '#/components/responses/CommandNotFound' }

  /users/{id}:
    get: { $ref: '#/x-operationTemplates/getUser' }
  /organizations/{id}/users:
    post:
      tags: [identity]
      operationId: createUser
      x-safety: { csrf: required, idempotency: required, ifMatch: exempt }
      parameters:
        - { $ref: '#/components/parameters/ResourceId' }
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { $ref: '#/components/parameters/IdempotencyHeader' }
        - { $ref: '#/components/parameters/RequestIdHeader' }
      requestBody: { $ref: '#/components/requestBodies/UserCreateRequest' }
      responses:
        '201': { $ref: '#/components/responses/CreatedUser' }
        '202': { $ref: '#/components/responses/CommandStatusInProgress' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '409': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /users/{id}/role-bindings:
    put:
      tags: [identity]
      operationId: updateUserRoleBindings
      x-safety: { csrf: required, idempotency: required, ifMatch: required }
      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/CsrfHeader' }, { $ref: '#/components/parameters/IdempotencyHeader' }, { $ref: '#/components/parameters/IfMatchHeader' }]
      requestBody: { $ref: '#/components/requestBodies/RoleBindingsUpdateRequest' }
      responses: { '200': { $ref: '#/components/responses/User' }, '202': { $ref: '#/components/responses/CommandStatusInProgress' }, '403': { $ref: '#/components/responses/CsrfFailed' }, '409': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/PreconditionRequired' } }
  /users/{id}/data-scope-grants:
    put:
      tags: [identity]
      operationId: updateUserDataScopeGrants
      x-safety: { csrf: required, idempotency: required, ifMatch: required }
      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/CsrfHeader' }, { $ref: '#/components/parameters/IdempotencyHeader' }, { $ref: '#/components/parameters/IfMatchHeader' }]
      requestBody: { $ref: '#/components/requestBodies/DataScopeUpdateRequest' }
      responses: { '200': { $ref: '#/components/responses/User' }, '202': { $ref: '#/components/responses/CommandStatusInProgress' }, '403': { $ref: '#/components/responses/CsrfFailed' }, '409': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/PreconditionRequired' } }
  /users/{id}/disable:
    post:
      tags: [identity]
      operationId: disableUser
      x-safety: { csrf: required, idempotency: required, ifMatch: required }
      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/CsrfHeader' }, { $ref: '#/components/parameters/IdempotencyHeader' }, { $ref: '#/components/parameters/IfMatchHeader' }]
      responses: { '202': { $ref: '#/components/responses/CommandStatusInProgress' }, '403': { $ref: '#/components/responses/CsrfFailed' }, '409': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/PreconditionRequired' } }

  /customers:
    get: { $ref: '#/x-operationTemplates/listCustomers' }
    post:
      tags: [customers]
      operationId: createCustomer
      x-safety: { csrf: required, idempotency: required, ifMatch: exempt }
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }, { $ref: '#/components/parameters/IdempotencyHeader' }, { $ref: '#/components/parameters/RequestIdHeader' }]
      requestBody: { $ref: '#/components/requestBodies/CustomerCreateRequest' }
      responses: { '201': { $ref: '#/components/responses/CreatedCustomer' }, '202': { $ref: '#/components/responses/CommandStatusInProgress' }, '403': { $ref: '#/components/responses/CsrfFailed' }, '409': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/PreconditionRequired' } }
  /customers/{id}:
    get: { $ref: '#/x-operationTemplates/getCustomer' }
    patch:
      tags: [customers]
      operationId: updateCustomer
      x-safety: { csrf: required, idempotency: required, ifMatch: required }
      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/CsrfHeader' }, { $ref: '#/components/parameters/IdempotencyHeader' }, { $ref: '#/components/parameters/IfMatchHeader' }]
      requestBody: { $ref: '#/components/requestBodies/CustomerUpdateRequest' }
      responses: { '200': { $ref: '#/components/responses/Customer' }, '202': { $ref: '#/components/responses/CommandStatusInProgress' }, '403': { $ref: '#/components/responses/CsrfFailed' }, '409': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/PreconditionRequired' } }
  /customers/{id}/submit-approval:
    post:
      $ref: '#/x-operationTemplates/customerCommand'
      operationId: submitCustomerApproval
  /customers/{id}/approve:
    post:
      $ref: '#/x-operationTemplates/customerCommand'
      operationId: approveCustomer
  /customers/{id}/reject:
    post:
      $ref: '#/x-operationTemplates/customerCommand'
      operationId: rejectCustomer
  /customers/{id}/reassign:
    post:
      $ref: '#/x-operationTemplates/customerCommand'
      operationId: reassignCustomer

  /products:
    get: { $ref: '#/x-operationTemplates/listProducts' }
    post:
      $ref: '#/x-operationTemplates/createProduct'
      operationId: createProduct
  /products/{id}:
    get: { $ref: '#/x-operationTemplates/getProduct' }
    patch:
      $ref: '#/x-operationTemplates/updateProduct'
      operationId: updateProduct
  /skus:
    get: { $ref: '#/x-operationTemplates/listSkus' }
    post:
      $ref: '#/x-operationTemplates/createSku'
      operationId: createSku
  /skus/{id}:
    get: { $ref: '#/x-operationTemplates/getSku' }
    patch:
      $ref: '#/x-operationTemplates/updateSku'
      operationId: updateSku

  /orders:
    get: { $ref: '#/x-operationTemplates/listOrders' }
    post:
      $ref: '#/x-operationTemplates/createOrder'
      operationId: createOrder
  /orders/{id}:
    get: { $ref: '#/x-operationTemplates/getOrder' }
    patch:
      $ref: '#/x-operationTemplates/updateOrder'
      operationId: updateOrder
  /orders/{id}/transitions:
    post:
      $ref: '#/x-operationTemplates/orderCommand'
      operationId: transitionOrder

  /inventory/balances:
    get:
      $ref: '#/x-operationTemplates/listInventoryBalances'
      operationId: listInventoryBalances
  /inventory/movements:
    get:
      $ref: '#/x-operationTemplates/listInventoryMovements'
      operationId: listInventoryMovements
  /inventory/reservations:
    get:
      $ref: '#/x-operationTemplates/listInventoryReservations'
      operationId: listInventoryReservations
    post:
      $ref: '#/x-operationTemplates/createInventoryReservation'
      operationId: createInventoryReservation
  /inventory/reservations/{id}:
    get: { $ref: '#/x-operationTemplates/getInventory' }
  /inventory/reservations/{id}/release:
    post:
      $ref: '#/x-operationTemplates/inventoryCommand'
      operationId: releaseInventoryReservation
  /inventory/observations:
    get:
      $ref: '#/x-operationTemplates/listInventoryObservations'
      operationId: listInventoryObservations
    post:
      $ref: '#/x-operationTemplates/createInventoryObservation'
      operationId: createInventoryObservation
  /inventory/operations/{id}:
    get: { $ref: '#/x-operationTemplates/getInventoryOperation' }
  /inventory/initial-receipts:
    post:
      $ref: '#/x-operationTemplates/createInventoryOperation'
      operationId: createInitialReceipt
  /inventory/receipts:
    post:
      $ref: '#/x-operationTemplates/createInventoryOperation'
      operationId: createInventoryReceipt
  /inventory/adjustments:
    post:
      $ref: '#/x-operationTemplates/createInventoryOperation'
      operationId: createInventoryAdjustment
  /inventory/issues:
    post:
      $ref: '#/x-operationTemplates/createInventoryOperation'
      operationId: issueInventory
  /inventory/operations/{operationId}/reverse:
    post:
      tags: [inventory]
      operationId: reverseInventoryOperation
      x-safety: { csrf: required, idempotency: required, ifMatch: required }
      parameters: [{ $ref: '#/components/parameters/OperationId' }, { $ref: '#/components/parameters/CsrfHeader' }, { $ref: '#/components/parameters/IdempotencyHeader' }, { $ref: '#/components/parameters/IfMatchHeader' }]
      requestBody: { $ref: '#/components/requestBodies/InventoryCommandRequest' }
      responses: { '201': { $ref: '#/components/responses/CreatedInventoryOperation' }, '202': { $ref: '#/components/responses/CommandStatusInProgress' }, '403': { $ref: '#/components/responses/CsrfFailed' }, '409': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/PreconditionRequired' } }

  /payments:
    get: { $ref: '#/x-operationTemplates/listPayments' }
    post:
      $ref: '#/x-operationTemplates/createPayment'
      operationId: createPayment
  /payments/{id}:
    get: { $ref: '#/x-operationTemplates/getPayment' }
  /payments/{id}/proofs:
    post:
      $ref: '#/x-operationTemplates/paymentCommand'
      operationId: attachPaymentProof
  /payments/{id}/submit-review:
    post:
      $ref: '#/x-operationTemplates/paymentCommand'
      operationId: submitPaymentReview
  /payments/{id}/review:
    post:
      $ref: '#/x-operationTemplates/paymentCommand'
      operationId: reviewPayment
  /payments/{id}/reverse:
    post:
      $ref: '#/x-operationTemplates/paymentCommand'
      operationId: reversePayment

  /files/{id}:
    get: { $ref: '#/x-operationTemplates/getFile' }
  /files/upload-intents:
    post:
      $ref: '#/x-operationTemplates/createFile'
      operationId: createUploadIntent
  /files/{id}/complete:
    post:
      $ref: '#/x-operationTemplates/fileCommand'
      operationId: completeUpload
  /files/{id}/download-intents:
    post:
      tags: [files]
      operationId: createDownloadIntent
      x-safety: { csrf: required, idempotency: exempt, ifMatch: exempt }
      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/CsrfHeader' }]
      responses: { '201': { $ref: '#/components/responses/CreatedFile' }, '403': { $ref: '#/components/responses/CsrfFailed' }, '404': { $ref: '#/components/responses/Problem' } }

  /orders/{orderId}/documents:
    get: { $ref: '#/x-operationTemplates/listDocuments' }
    post:
      $ref: '#/x-operationTemplates/createDocument'
      operationId: createDocument
  /documents/{id}:
    get: { $ref: '#/x-operationTemplates/getDocument' }
    patch:
      $ref: '#/x-operationTemplates/updateDocument'
      operationId: updateDocument
  /documents/{id}/versions:
    post:
      $ref: '#/x-operationTemplates/documentCommand'
      operationId: createDocumentVersion
  /documents/{id}/submit:
    post:
      $ref: '#/x-operationTemplates/documentCommand'
      operationId: submitDocument
  /documents/{id}/approve:
    post:
      $ref: '#/x-operationTemplates/documentCommand'
      operationId: approveDocument
  /documents/{id}/reject:
    post:
      $ref: '#/x-operationTemplates/documentCommand'
      operationId: rejectDocument
  /documents/{id}/finalize:
    post:
      $ref: '#/x-operationTemplates/documentCommand'
      operationId: finalizeDocument
  /documents/{id}/issue:
    post:
      $ref: '#/x-operationTemplates/documentCommand'
      operationId: issueDocument
  /documents/{id}/void:
    post:
      $ref: '#/x-operationTemplates/documentCommand'
      operationId: voidDocument

  /tasks:
    get: { $ref: '#/x-operationTemplates/listTasks' }
    post:
      $ref: '#/x-operationTemplates/createTask'
      operationId: createTask
  /tasks/{id}:
    get: { $ref: '#/x-operationTemplates/getTask' }
  /tasks/{id}/complete:
    post:
      $ref: '#/x-operationTemplates/taskCommand'
      operationId: completeTask
  /audit-events:
    get: { $ref: '#/x-operationTemplates/listAudit' }

components:
  securitySchemes:
    CookieSession:
      type: apiKey
      in: cookie
      name: session_id
  parameters:
    ResourceId: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    OperationId: { name: operationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    CsrfHeader: { name: X-CSRF-Token, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 512 } }
    IdempotencyHeader: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[\x21-\x7E]+$' } }
    IfMatchHeader: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"v[1-9][0-9]*"$' } }
    RequestIdHeader: { name: X-Request-ID, in: header, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
    CommandOperationHeader: { name: X-Command-Operation, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
    PageAfter: { name: 'page[after]', in: query, required: false, schema: { type: string, minLength: 1, maxLength: 512 } }
    PageSize: { name: 'page[size]', in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Sort: { name: sort, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 256, default: '-updatedAt,-id' } }
    Filter: { name: filter, in: query, required: false, style: form, explode: true, schema: { type: array, minItems: 1, maxItems: 20, items: { type: string, minLength: 1, maxLength: 256 } } }
  requestBodies:
    JsonObject:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/JsonObject' } } }
    SessionRequest:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/SessionRequest' } } }
    UserCreateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserCreateRequest' } } } }
    RoleBindingsUpdateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleBindingsUpdateRequest' } } } }
    DataScopeUpdateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DataScopeUpdateRequest' } } } }
    CustomerCreateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerCreateRequest' } } } }
    CustomerUpdateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerUpdateRequest' } } } }
    CustomerCommandRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerCommandRequest' } } } }
    InventoryCommandRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryCommandRequest' } } } }
    ResourceCreateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceCreateRequest' } } } }
    ResourceUpdateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceUpdateRequest' } } } }
    ResourceCommandRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceCommandRequest' } } } }
    ProductCreateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductCreateRequest' } } } }
    SkuCreateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SkuCreateRequest' } } } }
    OrderCreateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderCreateRequest' } } } }
    InventoryReservationCreateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryReservationCreateRequest' } } } }
    InventoryObservationCreateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryObservationCreateRequest' } } } }
    InventoryOperationCreateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryOperationCreateRequest' } } } }
    PaymentCreateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentCreateRequest' } } } }
    FileCreateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FileCreateRequest' } } } }
    TaskCreateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCreateRequest' } } } }
    ProductUpdateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductUpdateRequest' } } } }
    SkuUpdateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SkuUpdateRequest' } } } }
    OrderUpdateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderUpdateRequest' } } } }
    DocumentUpdateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentUpdateRequest' } } } }
    OrderCommandRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderCommandRequest' } } } }
    InventoryCommandRequestTyped: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryCommandRequestTyped' } } } }
    PaymentCommandRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentCommandRequest' } } } }
    DocumentCommandRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentCommandRequest' } } } }
    TaskCommandRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCommandRequest' } } } }
    FileCommandRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FileCommandRequest' } } } }
    DocumentCreateRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentCreateRequest' } } } }
  responses:
    Resource: { description: A typed resource envelope., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, ETag: { $ref: '#/components/headers/ETag' }, Location: { $ref: '#/components/headers/Location' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }
    CreatedResource: { description: A newly created typed resource envelope., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, ETag: { $ref: '#/components/headers/ETag' }, Location: { $ref: '#/components/headers/Location', x-required: true } }, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }
    CreatedProduct: { description: Newly created product., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, ETag: { $ref: '#/components/headers/ETag' }, Location: { $ref: '#/components/headers/Location', x-required: true } }, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
    CreatedSku: { description: Newly created SKU., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, ETag: { $ref: '#/components/headers/ETag' }, Location: { $ref: '#/components/headers/Location', x-required: true } }, content: { application/json: { schema: { $ref: '#/components/schemas/Sku' } } } }
    CreatedOrder: { description: Newly created order., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, ETag: { $ref: '#/components/headers/ETag' }, Location: { $ref: '#/components/headers/Location', x-required: true } }, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
    CreatedInventoryReservation: { description: Newly created inventory reservation., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, ETag: { $ref: '#/components/headers/ETag' }, Location: { $ref: '#/components/headers/Location', x-required: true } }, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryReservation' } } } }
    CreatedInventoryObservation: { description: Newly created inventory observation., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, ETag: { $ref: '#/components/headers/ETag' }, Location: { $ref: '#/components/headers/Location', x-required: true } }, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryObservation' } } } }
    CreatedPayment: { description: Newly created payment., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, ETag: { $ref: '#/components/headers/ETag' }, Location: { $ref: '#/components/headers/Location', x-required: true } }, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
    CreatedFile: { description: Newly created file resource., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, ETag: { $ref: '#/components/headers/ETag' }, Location: { $ref: '#/components/headers/Location', x-required: true } }, content: { application/json: { schema: { $ref: '#/components/schemas/File' } } } }
    CreatedDocument: { description: Newly created document., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, ETag: { $ref: '#/components/headers/ETag' }, Location: { $ref: '#/components/headers/Location', x-required: true } }, content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } } }
    CreatedTask: { description: Newly created task., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, ETag: { $ref: '#/components/headers/ETag' }, Location: { $ref: '#/components/headers/Location', x-required: true } }, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
    PageResource: { description: Cursor-paginated typed resources., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/PageResource' } } } }
    CustomerPage: { description: Cursor-paginated customers., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPage' } } } }
    ProductPage: { description: Cursor-paginated products., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ProductPage' } } } }
    SkuPage: { description: Cursor-paginated SKUs., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/SkuPage' } } } }
